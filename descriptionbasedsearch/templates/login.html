<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KnowWhere – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e8eaf0; font-family: Consolas, monospace;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1a1d27; border: 1px solid #2e3146; border-radius: 12px;
            padding: 48px 52px; width: 360px; }
    h1 { font-family: Georgia, serif; font-size: 24px; color: #e8eaf0;
         text-align: center; margin-bottom: 4px; }
    .subtitle { color: #4f8ef7; text-align: center; font-size: 13px; margin-bottom: 32px; }
    label { display: block; font-size: 12px; color: #7a7f94; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 12px; background: #252836; border: 1px solid #2e3146;
      color: #e8eaf0; border-radius: 6px; font-family: Consolas, monospace;
      font-size: 13px; margin-bottom: 20px; outline: none;
    }
    input:focus { border-color: #4f8ef7; }
    button[type=submit] {
      width: 100%; padding: 11px; background: #4f8ef7; color: #fff;
      border: none; border-radius: 6px; font-family: Consolas, monospace;
      font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #3a7be0; }
    .error { background: #2a1a1a; border: 1px solid #f74f4f; color: #f74f4f;
             padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
    .flash { background: #1a2a1a; border: 1px solid #4fba74; color: #4fba74;
             padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⬡ KnowWhere</h1>
    <p class="subtitle">Corporate Search System</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    {% if error %}
      <div class="error" id="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             placeholder="Enter username" autocomplete="off" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter password" required>

      <button type="submit" id="login-btn">Login</button>
    </form>
  </div>
</body>
</html>
